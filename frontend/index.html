<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none';">
    <meta name="theme-color" content="#4F46E5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="隐墨">
    <link rel="manifest" href="/manifest.json">
    <title>隐墨 (YinMo)</title>
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        /* ── Surface colors ── */
        --bg-app: #FAFAFA;
        --bg-sidebar: #F3F3F3;
        --bg-editor: #FFFFFF;
        --bg-hover: #EBEBEB;
        --bg-active: #EEF2FF;
        --accent: #4F46E5;
        --color-accent: #4F46E5;
        --accent-light: #EEF2FF;
        --text-primary: #18181B;
        --text-secondary: #52525B;
        --text-muted: #A1A1AA;
        --border: #E4E4E7;
        --border-strong: #D4D4D8;

        /* ── Semantic status colors ── */
        --color-success: #16A34A;
        --color-success-light: rgba(22,163,74,0.08);
        --color-warning: #D97706;
        --color-warning-light: rgba(217,119,6,0.08);
        --color-danger: #DC2626;
        --color-danger-light: rgba(220,38,38,0.08);
        --color-info: #2563EB;
        --color-info-light: rgba(37,99,235,0.08);

        /* ── Shadows ── */
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
        --shadow-lg: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);

        /* ── Radii ── */
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;

        /* ── Type scale (5 levels) ── */
        --text-xs: 11px;
        --lh-xs: 16px;
        --text-sm: 13px;
        --lh-sm: 20px;
        --text-base: 14px;
        --lh-base: 22px;
        --text-lg: 16px;
        --lh-lg: 24px;
        --text-xl: 20px;
        --lh-xl: 28px;

        /* ── Animation easings ── */
        --ease-micro: cubic-bezier(0.2, 0, 0, 1);
        --duration-micro: 120ms;
        --ease-normal: cubic-bezier(0.32, 0.72, 0, 1);
        --duration-normal: 200ms;
        --ease-expressive: cubic-bezier(0.16, 1, 0.3, 1);
        --duration-expressive: 350ms;
      }

      .dark {
        --bg-app: #09090B;
        --bg-sidebar: #111113;
        --bg-editor: #18181B;
        --bg-hover: #27272A;
        --bg-active: #1E1B4B;
        --accent: #818CF8;
        --color-accent: #818CF8;
        --accent-light: rgba(129,140,248,0.10);
        --text-primary: #FAFAFA;
        --text-secondary: #A1A1AA;
        --text-muted: #52525B;
        --border: rgba(255,255,255,0.08);
        --border-strong: rgba(255,255,255,0.12);
        --color-success: #22C55E;
        --color-success-light: rgba(34,197,94,0.12);
        --color-warning: #F59E0B;
        --color-warning-light: rgba(245,158,11,0.12);
        --color-danger: #EF4444;
        --color-danger-light: rgba(239,68,68,0.12);
        --color-info: #3B82F6;
        --color-info-light: rgba(59,130,246,0.12);
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
        --shadow-lg: 0 8px 24px rgba(0,0,0,0.6);
        --color-code-bg-dark: #0d1117;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-feature-settings: 'cv02', 'cv03', 'cv04';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
